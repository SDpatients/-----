# =============================================================
# 测试环境配置
# 使用 H2 内存数据库 + 禁用外部中间件
# =============================================================
spring:
  # H2 内存数据库（快速单元测试）
  datasource:
    url: jdbc:h2:mem:test_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  # 禁用所有外部中间件自动配置
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
      - org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
      - org.springframework.boot.autoconfigure.quartz.QuartzAutoConfiguration

  # 禁用 RabbitMQ 监听器
  rabbitmq:
    listener:
      simple:
        auto-startup: false
      direct:
        auto-startup: false

  # Jackson
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false

  # H2 自动建表 + 种子数据
  sql:
    init:
      mode: embedded
      schema-locations: classpath:sql/test-schema.sql
      data-locations: classpath:sql/test-data.sql

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.supplier.**.entity
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 测试用密钥
jwt:
  secret: test-secret-key-for-automated-testing-must-be-at-least-256-bits-long-enough-test
  expiration: 86400000
  refresh-expiration: 604800000
  header: Authorization
  prefix: "Bearer "

# 日志
logging:
  level:
    com.supplier: DEBUG
    org.springframework.test: INFO
    org.springframework.security: WARN
    org.springframework.boot.autoconfigure: WARN